plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'dev.lukebemish.central-portal-publishing' version '0.1.9'
}

group = 'io.github.sawfowl'
version = '1.0.0'

repositories {
	mavenCentral()
	maven {
		name = 'velocity'
		url = 'https://nexus.velocitypowered.com/repository/maven-public/'
	}
}

dependencies {
	implementation 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'
	annotationProcessor 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'

	implementation "org.spongepowered:configurate-core:${configurate}"
	implementation "org.spongepowered:configurate-gson:${configurate}"
	implementation "org.spongepowered:configurate-hocon:${configurate}"
	implementation "org.spongepowered:configurate-jackson:${configurate}"
	implementation "org.spongepowered:configurate-xml:${configurate}"
	implementation "org.spongepowered:configurate-extra-dfu2:${configurate}"
	implementation "org.spongepowered:configurate-extra-dfu3:${configurate}"
	implementation "org.spongepowered:configurate-extra-dfu4:${configurate}"
	implementation "org.spongepowered:configurate-extra-guice:${configurate}"
	implementation "org.spongepowered:configurate-extra-kotlin:${configurate}"
	implementation "net.kyori:adventure-serializer-configurate4:${adventure}"
	implementation "io.leangen.geantyref:geantyref:2.0.0"
	implementation "jakarta.inject:jakarta.inject-api:2.0.1"
	implementation "aopalliance:aopalliance:1.0"
	implementation 'io.netty:netty-all:4.1.114.Final'
}

java {
	withSourcesJar()
	withJavadocJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

javadoc {
	options.encoding = 'UTF-8'
	options.addStringOption('Xdoclint:none', '-quiet')
	if (JavaVersion.current().isJava9Compatible()) {
		options.addBooleanOption('html5', true)
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			pom {
				name = 'Synapse API'
				description = 'API for Synapse plugin - Velocity command, config and localization framework'
				url = 'https://github.com/SawFowl/Synapse'

				licenses {
					license {
						name = 'MIT License'
						url = 'https://opensource.org/licenses/MIT'
					}
				}

				developers {
					developer {
						id = 'SawFowl'
						name = 'SawFowl'
						email = 'stalkeriv@yandex.ru'
					}
				}

				scm {
					connection = 'scm:git:git://github.com/SawFowl/Synapse.git'
					developerConnection = 'scm:git:ssh://github.com/SawFowl/Synapse.git'
					url = 'https://github.com/SawFowl/Synapse'
				}
			}
		}
	}
}

signing {
	useGpgCmd()
	sign publishing.publications.mavenJava
}

centralPortalPublishing {
	bundle('synapse') {
		username = project.findProperty('mavenCentral.username') ?: System.getenv('MAVEN_CENTRAL_USERNAME')
		password = project.findProperty('mavenCentral.password') ?: System.getenv('MAVEN_CENTRAL_PASSWORD')
		publishingType = "AUTOMATIC"
	}
}
