plugins {
	id 'java-library'
}

version = '1.0.0'
group = 'io.github.sawfowl'
description = 'API for Synapse plugin - Velocity command, config and localization framework'

base {
	archivesName = 'synapse-api'
}

java {
	withSourcesJar()
	withJavadocJar()
}

repositories {
	mavenCentral()
	maven {
		name = 'velocity'
		url = 'https://nexus.velocitypowered.com/repository/maven-public/'
	}
}

dependencies {
	compileOnly 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'
	annotationProcessor 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'

	compileOnly "org.spongepowered:configurate-core:${configurate}"
	compileOnly "org.spongepowered:configurate-gson:${configurate}"
	compileOnly "org.spongepowered:configurate-hocon:${configurate}"
	compileOnly "org.spongepowered:configurate-jackson:${configurate}"
	compileOnly "org.spongepowered:configurate-xml:${configurate}"
	compileOnly "org.spongepowered:configurate-extra-dfu2:${configurate}"
	compileOnly "org.spongepowered:configurate-extra-dfu3:${configurate}"
	compileOnly "org.spongepowered:configurate-extra-dfu4:${configurate}"
	compileOnly "org.spongepowered:configurate-extra-guice:${configurate}"
	compileOnly "org.spongepowered:configurate-extra-kotlin:${configurate}"
	compileOnly "net.kyori:adventure-serializer-configurate4:${adventure}"
	compileOnly "io.leangen.geantyref:geantyref:2.0.0"
	compileOnly "jakarta.inject:jakarta.inject-api:2.0.1"
	compileOnly "aopalliance:aopalliance:1.0"
	compileOnly 'io.netty:netty-all:4.1.114.Final'
}

javadoc {
	options.encoding = 'UTF-8'
	options.addStringOption('Xdoclint:none', '-quiet')
	if (JavaVersion.current().isJava9Compatible()) {
		options.addBooleanOption('html5', true)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}