plugins {
	id("com.gradleup.shadow") version "9.0.0-beta4"
}

version = "${major}.${minor}.${patch}-${suffix}"

dependencies {
	implementation project(":shading-configure")
	implementation project(":shading-geyser")
	implementation project(":synapse-api")
	implementation 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'
	//compileOnly 'com.velocitypowered:velocity-proxy:4.0.0-SNAPSHOT'
	annotationProcessor 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'

	implementation "org.spongepowered:configurate-core:${configurate}"
	implementation "org.spongepowered:configurate-gson:${configurate}"
	implementation "org.spongepowered:configurate-hocon:${configurate}"
	implementation "org.spongepowered:configurate-jackson:${configurate}"
	implementation "org.spongepowered:configurate-xml:${configurate}"
	implementation "org.spongepowered:configurate-extra-dfu2:${configurate}"
	implementation "org.spongepowered:configurate-extra-dfu3:${configurate}"
	implementation "org.spongepowered:configurate-extra-dfu4:${configurate}"
	implementation "org.spongepowered:configurate-extra-guice:${configurate}"
	implementation "org.spongepowered:configurate-extra-kotlin:${configurate}"
	implementation "net.kyori:adventure-serializer-configurate4:${adventure}"
	implementation "org.spongepowered:configurate-yaml:4.2.0-GeyserMC-SNAPSHOT"
	implementation "io.leangen.geantyref:geantyref:2.0.0"
	implementation "jakarta.inject:jakarta.inject-api:2.0.1"
	implementation "aopalliance:aopalliance:1.0"
	implementation 'io.netty:netty-all:4.1.114.Final'

	shadow "net.kyori:adventure-serializer-configurate4:${adventure}"
	shadow "org.spongepowered:configurate-yaml:4.2.0-GeyserMC-SNAPSHOT"
	shadow "io.leangen.geantyref:geantyref:2.0.0"
	shadow "jakarta.inject:jakarta.inject-api:2.0.1"
	shadow "aopalliance:aopalliance:1.0"
}

shadowJar {
	dependencies {
		include(dependency("net.kyori:adventure-serializer-configurate4:${adventure}"))
		include(dependency("org.spongepowered:configurate-yaml:4.2.0-GeyserMC-SNAPSHOT"))
		include(dependency("io.leangen.geantyref:geantyref:2.0.0"))
		include(dependency("jakarta.inject:jakarta.inject-api:2.0.1"))
		include(dependency("aopalliance:aopalliance:1.0"))
		include(project(path: ':shading-configure'))
		include(project(path: ':shading-geyser'))
		include(project(path: ':synapse-api'))
	}
	archiveFileName.set("Synapse-${version}.jar")
}

build.dependsOn(shadowJar);
